name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: bechde

jobs:
  check:
    name: typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bechde/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders — the app reads Supabase at runtime in the
          # browser, so these only need to be present and well-formed.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database:
    name: RLS + end-to-end against a real stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bechde/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci
      - name: Start Supabase
        run: supabase start
      - name: Write .env.local from the local stack
        run: supabase status -o env | sed -e 's/^ANON_KEY/NEXT_PUBLIC_SUPABASE_ANON_KEY/' -e 's/^SERVICE_ROLE_KEY/SUPABASE_SERVICE_ROLE_KEY/' -e 's/^API_URL/NEXT_PUBLIC_SUPABASE_URL/' > .env.local
      - name: Seed
        run: npm run seed

      - name: RLS suite
        run: npm run test:db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: bechde/playwright-report/
          retention-days: 7
